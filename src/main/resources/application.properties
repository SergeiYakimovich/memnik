spring.application.name=memnik
logging.level.org.springframework=INFO

# URL properties
server.port=${MEMNIK_SERVER_PORT:8181}
memnik.application-url=${MEMNIK_APPLICATION_URL:localhost:8181}

# Database properties
spring.datasource.url=${MEMNIK_DB_URL:jdbc:postgresql://localhost:5432/memnik?currentSchema=memnik}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=memnik

# Liquibase properties
spring.liquibase.change-log=classpath:db/main-changelog.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# View properties
spring.mvc.view.prefix="classpath:templates/"
spring.mvc.view.suffix=".html"

# Mail properties
spring.mail.protocol: smtps
spring.mail.host: smtp.yandex.ru
spring.mail.port: 465
spring.mail.username: ${MEMNIK_MAIL_USERNAME:}
spring.mail.password: ${MEMNIK_MAIL_PASSWORD:}

# Tg-bot properties
memnik.tgbot.token=${MEMNIK_TGBOT_TOKEN:}
memnik.tgbot.name=${MEMNIK_TGBOT_URL:}

# Maximum file size for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
