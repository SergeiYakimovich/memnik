version: '3.8'
services:
  client-backend-dev:
    image: memnik-dev:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8182:8182"
    depends_on:
      service-db-dev:
        condition: service_healthy
    environment:
      - MEMNIK_SERVER_PORT= 8182
      - MEMNIK_APPLICATION_URL= 109.172.114.118:8182
      - MEMNIK_DB_URL= jdbc:postgresql://localhost:25432/memnik_dev?currentSchema=memnik
      - SPRING_DATASOURCE_URL=jdbc:postgresql://service-db-dev/memnik_dev?currentSchema=memnik
      - SPRING_DATASOURCE_USERNAME=${MEMNIK_DB_USER:}
      - SPRING_DATASOURCE_PASSWORD=${MEMNIK_DB_PASS:}
    volumes:
      - storage-dev:/usr/app/storage

  service-db-dev:
    image: postgres:14.7-alpine
    container_name: service-db-dev
    environment:
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "books_db"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "25432:5432"
    volumes:
      - ./src/main/resources/db/init_db-dev.sql:/docker-entrypoint-initdb.d/init_db.sql
      - db-dev:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4:7
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:
      PGADMIN_DEFAULT_PASSWORD:
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin

volumes:
  storage-dev:
  db-dev:
  pgadmin: